name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Committed outputs are current
        run: git diff --exit-code -- . ':(exclude)docs/ui-kits/ds-bundle.js'
      - run: npm test
