<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/styles/index.css"><style>body{padding:16px;background:var(--surface-page)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.sw{display:flex;flex-direction:column;justify-content:flex-end;width:104px;height:84px;padding:8px;border-radius:var(--radius-md);border:1px solid var(--border-default);font:700 10px/1.3 var(--font-body);letter-spacing:.06em}.sw b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.mono{font:400 11px/1.4 var(--font-mono);color:var(--text-muted)}.lbl{font:700 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="background:#FFFFFF;color:#000;border-color:var(--border-default)"><b>White</b><span>#FFFFFF</span><span style="font-weight:400;opacity:.75">--rg-white</span></div><div class="sw" style="background:#F2F2F2;color:#000;border-color:var(--border-default)"><b>Paper</b><span>#F2F2F2</span><span style="font-weight:400;opacity:.75">--rg-paper</span></div><div class="sw" style="background:#E2E2E2;color:#000;border-color:var(--border-default)"><b>Line</b><span>#E2E2E2</span><span style="font-weight:400;opacity:.75">--rg-line</span></div><div class="sw" style="background:#666666;color:#fff;border-color:#2e2e2e"><b>Mute</b><span>#666666</span><span style="font-weight:400;opacity:.75">--rg-mute</span></div><div class="sw" style="background:#161616;color:#fff;border-color:#2e2e2e"><b>Ink</b><span>#161616</span><span style="font-weight:400;opacity:.75">--rg-ink</span></div><div class="sw" style="background:#000000;color:#fff;border-color:#2e2e2e"><b>Black</b><span>#000000</span><span style="font-weight:400;opacity:.75">--rg-black</span></div></div></body></html>
