<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals: dark chrome" subtitle="Surfaces and lines for black UI." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/styles/index.css"><style>body{padding:16px;background:var(--surface-page)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.sw{display:flex;flex-direction:column;justify-content:flex-end;width:104px;height:84px;padding:8px;border-radius:var(--radius-md);border:1px solid var(--border-default);font:700 10px/1.3 var(--font-body);letter-spacing:.06em}.sw b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.mono{font:400 11px/1.4 var(--font-mono);color:var(--text-muted)}.lbl{font:700 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="background:#000;padding:12px;border-radius:8px"><div class="sw" style="background:#0B0B0B;color:#fff;border-color:#2e2e2e"><b>Surface</b><span>#0B0B0B</span><span style="font-weight:400;opacity:.75">--rg-dark-surface</span></div><div class="sw" style="background:#161616;color:#fff;border-color:#2e2e2e"><b>Surface 2</b><span>#161616</span><span style="font-weight:400;opacity:.75">--rg-dark-surface-2</span></div><div class="sw" style="background:#242424;color:#fff;border-color:#2e2e2e"><b>Surface 3</b><span>#242424</span><span style="font-weight:400;opacity:.75">--rg-dark-surface-3</span></div><div class="sw" style="background:#2E2E2E;color:#fff;border-color:#2e2e2e"><b>Line</b><span>#2E2E2E</span><span style="font-weight:400;opacity:.75">--rg-dark-line</span></div><div class="sw" style="background:#9A9A9A;color:#000;border-color:var(--border-default)"><b>Mute</b><span>#9A9A9A</span><span style="font-weight:400;opacity:.75">--rg-dark-mute</span></div></div></body></html>
