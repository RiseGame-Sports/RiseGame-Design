<!-- @dsCard group="Colors" viewport="700x150" name="Evaluation scale" subtitle="Neutral by design — accent marks the top only." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/styles/index.css"><style>body{padding:16px;background:var(--surface-page)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.sw{display:flex;flex-direction:column;justify-content:flex-end;width:104px;height:84px;padding:8px;border-radius:var(--radius-md);border:1px solid var(--border-default);font:700 10px/1.3 var(--font-body);letter-spacing:.06em}.sw b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.mono{font:400 11px/1.4 var(--font-mono);color:var(--text-muted)}.lbl{font:700 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="background:#1DFE1B;color:#000;border-color:var(--border-default)"><b>High</b><span>#1DFE1B</span><span style="font-weight:400;opacity:.75">--score-high</span></div><div class="sw" style="background:#161616;color:#fff;border-color:#2e2e2e"><b>Mid</b><span>#161616</span><span style="font-weight:400;opacity:.75">--score-mid</span></div><div class="sw" style="background:#666666;color:#fff;border-color:#2e2e2e"><b>Low</b><span>#666666</span><span style="font-weight:400;opacity:.75">--score-low</span></div><div class="sw" style="background:#E2E2E2;color:#000;border-color:var(--border-default)"><b>Unscored</b><span>#E2E2E2</span><span style="font-weight:400;opacity:.75">--score-empty</span></div>
<div class="col" style="gap:6px;margin-left:8px"><span class="lbl">No red. No urgency ramp.</span><span class="mono" style="max-width:220px">Call the output “evaluation scores”, never bare “scores”.</span></div></div></body></html>
