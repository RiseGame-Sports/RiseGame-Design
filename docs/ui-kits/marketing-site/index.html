<!DOCTYPE html><html><head><meta charset="utf-8"><title>RiseGame: Marketing Site</title><link rel="stylesheet" href="../../../dist/styles/index.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../ds-bundle.js"></script>
<style>body{margin:0}footer a{color:#fff}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Photo.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="ProductsPage.jsx"></script>
<script type="text/babel">
const { SiteHeader, Logo } = window.RiseGameDesignSystem_66bdc7;
const NAV = ['Home','About','Products','Testimonials','Blog','Tutorials'];
function App(){
  const [page,setPage]=React.useState('Home');
  return (<>
    <SiteHeader items={NAV} active={page} onNavigate={setPage} assetBase="../../../assets/logos/" />
    {page==='Products' ? <ProductsPage/> : <HomePage onNavigate={setPage}/>}
    <footer style={{background:'var(--surface-dark)',color:'var(--text-inverse)',borderTop:'1px solid var(--border-dark)',padding:'var(--space-7) var(--space-6)'}}>
      <div style={{maxWidth:'var(--container-max)',margin:'0 auto',display:'flex',flexWrap:'wrap',gap:'var(--space-7)',justifyContent:'space-between'}}>
        <div style={{display:'flex',flexDirection:'column',gap:'var(--space-3)',maxWidth:320}}>
          <Logo variant="wordmark" onDark height={24} assetBase="../../../assets/logos/" />
          <p style={{margin:0,fontSize:'var(--size-body-sm)',color:'var(--rg-dark-mute)'}}>Follow RiseGame on our social media platforms to stay informed on our latest updates and features.</p>
        </div>
        <nav style={{display:'flex',flexDirection:'column',gap:'var(--space-2)'}}>
          <span className="rg-eyebrow" style={{color:'var(--rg-dark-mute)'}}>Menu</span>
          {NAV.map(n=><a key={n} href="#" onClick={e=>{e.preventDefault();setPage(n);}} style={{fontSize:'var(--size-body-sm)'}}>{n}</a>)}
        </nav>
        <div style={{display:'flex',flexDirection:'column',gap:'var(--space-2)'}}>
          <span className="rg-eyebrow" style={{color:'var(--rg-dark-mute)'}}>Contact</span>
          <a href="mailto:info@risegame.com" style={{fontSize:'var(--size-body-sm)'}}>info@risegame.com</a>
          <span style={{fontSize:'var(--size-caption)',color:'var(--rg-dark-mute)'}}>&copy; 2026 RiseGame</span>
        </div>
      </div>
    </footer>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
