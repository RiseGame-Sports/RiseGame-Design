<!-- @startingPoint section="Tryouts App" subtitle="Coach roster + on-field scoring (mobile)" viewport="900x780" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>RiseGame: Tryouts App</title><link rel="stylesheet" href="../../../dist/styles/index.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../ds-bundle.js"></script><style>body{margin:0;background:var(--surface-chrome);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:40px}</style></head>
<body><div id="root"></div>
<script src="data.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="RosterScreen.jsx"></script>
<script type="text/babel" src="ScoreScreen.jsx"></script>
<script type="text/babel">
const { AppTabBar } = window.RiseGameDesignSystem_66bdc7;
function App(){
  const [players,setPlayers]=React.useState(window.TRYOUTS_DATA.players);
  const [active,setActive]=React.useState(null);
  const [tab,setTab]=React.useState('roster');
  const save=(number,scores)=>setPlayers(ps=>ps.map(p=>p.number===number?{...p,scores}:p));
  const player=active!==null?players.find(p=>p.number===active):null;
  return (
    <IOSDevice dark>
      <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
        <div style={{flex:1,minHeight:0}}>
          {player
            ? <ScoreScreen player={player} onBack={()=>setActive(null)} onSave={save} />
            : <RosterScreen players={players} onPick={p=>{setActive(p.number);setTab('score');}} />}
        </div>
        <AppTabBar value={tab} onChange={v=>{setTab(v);if(v==='roster')setActive(null);}} items={[
          {value:'roster',label:'Roster',icon:'users'},
          {value:'score',label:'Score',icon:'clipboard-list'},
          {value:'results',label:'Results',icon:'chart-no-axes-column'},
          {value:'more',label:'More',icon:'ellipsis'}]} />
      </div>
    </IOSDevice>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
